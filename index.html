<!DOCTYPE html>
<html lang="en" class="dark"> <!-- Default to Dark Mode -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BooleanMaster Pro | Circuit Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#3b82f6' } } }
        }
    </script>
    <style>
        /* Custom scrollbar for circuit diagram area */
        .circuit-container { cursor: grab; overflow: auto; background-image: radial-gradient(#4b5563 1px, transparent 1px); background-size: 20px 20px; }
        .circuit-container:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col justify-between">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-brand mb-8">LogicMaster</h1>
            <nav class="space-y-2">
                <a href="/" class="block px-4 py-2 rounded bg-brand text-white font-medium">Boolean Solver</a>
                <a href="/adders/" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition">Adders</a>
                <a href="/subtractors/" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition">Subtractors</a>
                <a href="/multipliers/" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition">Multipliers</a>
            </nav>
        </div>
        
        <!-- Dark Mode Toggle -->
        <div class="p-6 border-t border-gray-200 dark:border-gray-700">
            <button id="theme-toggle" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                <span id="theme-icon">☀️ Light Mode</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-8">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-bold">Boolean Function Solver</h2>
                <p class="text-gray-500 dark:text-gray-400 mt-1">Enter an expression to simplify and generate circuits (up to 8 variables).</p>
            </div>
            <div id="verification-badge" class="hidden px-4 py-2 bg-green-100 text-green-800 rounded-full text-sm font-bold border border-green-300 shadow-sm">
                ✓ Outputs Verified Identical
            </div>
        </header>

        <!-- Input Section -->
        <section class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-8">
            <div class="flex gap-4 mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">
                <button class="font-semibold text-brand border-b-2 border-brand pb-2">Expression</button>
                <button class="font-semibold text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 pb-2">Minterms/Maxterms</button>
                <button class="font-semibold text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 pb-2">Truth Table</button>
            </div>
            <div class="flex gap-4">
                <input type="text" id="boolean-input" placeholder="e.g., A*B + C'(A+D)" class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 focus:ring-2 focus:ring-brand focus:outline-none">
                <button onclick="generateEverything()" class="bg-brand hover:bg-blue-600 text-white px-8 py-3 rounded-lg font-bold transition shadow-md">Generate</button>
            </div>
        </section>

        <!-- Output Section: Circuits & Diagrams -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 flex-1 min-h-[500px]">
            <!-- Text Outputs -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <h3 class="font-bold text-gray-500 dark:text-gray-400 uppercase text-xs tracking-wider mb-2">Simplified Expression</h3>
                    <div id="output-expression" class="text-xl font-mono">--</div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 h-64 overflow-y-auto">
                    <h3 class="font-bold text-gray-500 dark:text-gray-400 uppercase text-xs tracking-wider mb-2">Truth Table</h3>
                    <table class="w-full text-left font-mono text-sm" id="truth-table-display">
                        <!-- Filled by JS -->
                    </table>
                </div>
            </div>

            <!-- Circuit Viewer -->
            <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col">
                <div class="flex border-b border-gray-200 dark:border-gray-700">
                    <button class="flex-1 py-3 text-center font-bold text-brand border-b-2 border-brand bg-gray-50 dark:bg-gray-700/50">Basic Gates</button>
                    <button class="flex-1 py-3 text-center font-bold text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-700/50">NAND Only</button>
                    <button class="flex-1 py-3 text-center font-bold text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-700/50">NOR Only</button>
                </div>
                <!-- Interactive Canvas (Custom SVG) -->
                <div class="flex-1 relative circuit-container" id="circuit-canvas">
                    <svg id="svg-layer" width="2000" height="1000" class="absolute top-0 left-0"></svg>
                </div>
            </div>
        </div>
    </main>

    <!-- Load our JS files -->
    <script src="js/ui.js"></script>
    <script src="js/svg-engine.js"></script>
</body>
</html>
